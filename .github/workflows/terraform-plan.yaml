name: AWS Terraform Plan

on:
    workflow_call:
        inputs:
            working_directory:
                description: 'Directory containing Terraform configuration'
                required: true
                type: string
            environment:
                description: 'Deployment environment (e.g., dev, staging, prod)'
                required: true
                type: string
            aws_role_arn:
                description: 'ARN of the AWS IAM role to assume for Terraform operations'
                required: true
                type: string
            aws_region:
                description: 'AWS region to use for Terraform operations'
                required: false
                type: string
            use_backend:
                description: 'Whether to use a remote backend for Terraform state'
                required: false
                type: boolean
                default: false
            backend_bucket:
                description: 'S3 bucket name for Terraform state if using remote backend'
                required: false
                type: string
            plan_only:
                description: 'Whether to only generate the plan without applying it'
                required: false
                type: boolean
                default: true
            build_version:
                description: 'Version of the build for artifact naming'
                required: false
                type: string

jobs:
    validate-input:
        runs-on: ubuntu-latest

        steps:
            - name: Validate Inputs
              run: |
                  if [ -z "${{ inputs.working_directory }}" ]; then
                      echo "Error: working_directory input is required."
                      exit 1
                  fi
                  if [ -z "${{ inputs.environment }}" ]; then
                      echo "Error: environment input is required."
                      exit 1
                  fi
                  if [ -z "${{ inputs.aws_role_arn }}" ]; then
                      echo "Error: aws_role_arn input is required."
                      exit 1
                  fi
                  if [ -z "${{ inputs.aws_region }}" ]; then
                      echo "Error: aws_region input is required."
                      exit 1
                  fi
                  if [ "${{ inputs.use_backend }}" == "true" ] && [ -z "${{ inputs.backend_bucket }}" ]; then
                      echo "Error: backend_bucket input is required when use_backend is true."
                      exit 1
                  fi

    terraform-plan:
        needs: validate-input

        runs-on: ubuntu-latest

        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up Terraform
              uses: hashicorp/setup-terraform@v4
              with:
                  terraform_version: 1.5.0

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: ${{ inputs.aws_role_arn }}
                  aws-region: ${{ inputs.aws_region }}

            - name: Initialize Terraform
              working-directory: ${{ inputs.working_directory }}
              if: ${{ inputs.use_backend == 'false' }}
              run: terraform init

            - name: Initialize Terraform with Backend
              working-directory: ${{ inputs.working_directory }}
              if: ${{ inputs.use_backend == 'true' }}
              run: terraform init -backend-config="bucket=${{ inputs.backend_bucket }}" -backend-config="key=terraform.tfstate" -backend-config="region=${{ inputs.aws_region }}"

            - name: Run Terraform Plan
              working-directory: ${{ inputs.working_directory }}
              run: terraform plan -out=tfplan -var="environment=${{ inputs.environment }}"

            - name: Upload Terraform Plan Artifact
              uses: actions/upload-artifact@v7
              if: ${{ inputs.plan_only == 'false' }}
              with:
                name: plan-artifact-${{ inputs.environment }}-${{ inputs.build_version }}
                files: ${{ inputs.working_directory }}/tfplan
                

        
